<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
    <meta name="theme-color" content="#ffffff" />
    <title>Trazo</title>
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="/css/styles.css" />
  </head>
  <body class="board-page">
    <canvas id="board" aria-label="Pizarra"></canvas>
    <div id="editor-layer" class="editor-layer"></div>

    <header class="topbar">
      <div class="cluster">
        <button id="menu-btn" class="icon-btn" title="Menú" aria-label="Menú"></button>
        <div id="menu" class="popover" hidden></div>
        <span class="room-badge" title="Código de la sala">
          <span id="status" class="status" data-state="connecting" title="Conectando…"></span>
          <span id="room-code"></span>
          <span id="latency" class="latency" hidden></span>
        </span>
        <span id="host-chip" class="host-chip" title="Esta ventana es la presentación principal: recibe las cámaras y el control de diapositivas" hidden>★ Principal</span>
        <button id="screen-badge" class="live-badge" title="Encajar la pantalla compartida" hidden>
          <span class="dot"></span> <span class="label">Pantalla en vivo</span>
        </button>
        <button id="follow-btn" class="btn small follow-btn" title="Volver a seguir lo que muestra el presentador" hidden></button>
        <button id="fullscreen-btn" class="icon-btn" title="Ver a pantalla completa" aria-label="Ver a pantalla completa" hidden></button>
      </div>
      <div class="cluster">
        <div id="presence" class="presence" aria-label="Participantes"></div>
        <button id="react-btn" class="icon-btn" title="Reaccionar" aria-label="Reaccionar"></button>
        <button id="cam-btn" class="icon-btn" title="Encender mi cámara" aria-label="Encender mi cámara" hidden></button>
        <button id="share-btn" class="btn primary small" title="Invitar desde el celular u otro equipo">Compartir</button>
      </div>
    </header>

    <button id="exit-immersive" class="icon-btn exit-immersive" title="Salir de pantalla completa" aria-label="Salir de pantalla completa"></button>
    <nav id="toolbar" class="toolbar" aria-label="Herramientas"></nav>
    <div id="self-view" class="self-view" hidden>
      <video id="self-video" autoplay playsinline muted></video>
      <div class="self-actions">
        <button id="cam-flip" class="icon-btn" title="Cambiar de cámara" aria-label="Cambiar de cámara"></button>
        <button id="cam-stop" class="icon-btn danger" title="Apagar mi cámara" aria-label="Apagar mi cámara"></button>
      </div>
    </div>
    <div id="slide-pad" class="slide-pad" hidden>
      <button class="slide-btn" data-slide="prev" aria-label="Diapositiva anterior">‹</button>
      <span>Diapositivas</span>
      <button class="slide-btn" data-slide="next" aria-label="Diapositiva siguiente">›</button>
    </div>
    <aside id="style-panel" class="style-panel" aria-label="Estilo"></aside>

    <footer class="bottombar">
      <div class="group">
        <button id="zoom-out" class="icon-btn" title="Alejar" aria-label="Alejar"></button>
        <button id="zoom-label" class="zoom-label" title="Restablecer al 100%">100%</button>
        <button id="zoom-in" class="icon-btn" title="Acercar" aria-label="Acercar"></button>
        <button id="fit-btn" class="icon-btn hide-mobile" title="Ajustar a la pantalla" aria-label="Ajustar a la pantalla"></button>
      </div>
      <div class="group">
        <button id="undo-btn" class="icon-btn" title="Deshacer (Ctrl+Z)" aria-label="Deshacer"></button>
        <button id="redo-btn" class="icon-btn" title="Rehacer (Ctrl+Y)" aria-label="Rehacer"></button>
      </div>
      <div class="group">
        <button id="delete-btn" class="icon-btn danger" title="Eliminar selección (Supr)" aria-label="Eliminar selección" hidden></button>
      </div>
    </footer>

    <script type="module" src="/js/board/main.js"></script>
  </body>
</html>
